<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Schnitzeljagd durch den Kessel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
/* Layout: one phone-sized column, a card per step, letter tray on top. Deliberately single dark night theme. */
:root{
  --bg:#17142b; --panel:#221d3d; --panel-2:#2c2650; --line:#3a3365;
  --fg:#f3eefc; --muted:#a79fc9; --amber:#ffb84d; --pink:#ff7ab3; --ok:#6be3a4; --bad:#ff6b6b;
  --f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;
  background-image:radial-gradient(circle at 15% 0%,rgba(255,122,179,.12),transparent 40%),radial-gradient(circle at 100% 30%,rgba(255,184,77,.08),transparent 45%);
  background-attachment:fixed;min-height:100%}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);font-weight:600}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,8vw,38px);line-height:1.05;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1.15;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.track{display:flex;gap:6px;align-items:center}
.track span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.track span.done{background:var(--amber)}
.track span.now{background:var(--pink)}
.tray{display:flex;gap:6px;flex-wrap:wrap}
.tile{width:36px;height:42px;border-radius:8px;border:1.5px dashed var(--line);display:grid;place-items:center;
  font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--muted)}
.tile.got{border:1.5px solid var(--amber);background:rgba(255,184,77,.12);color:var(--amber)}
.tile.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.tag{align-self:flex-start;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--panel-2);color:var(--pink)}
.tag.amber{color:var(--amber)}
.riddle{font-family:var(--f-display);font-size:20px;line-height:1.35;font-weight:500}
.hint{background:var(--panel-2);border-radius:12px;padding:10px 14px;font-size:15px}
.note{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],textarea{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg)}
textarea{width:100%;font-family:var(--f-mono);font-size:12px;line-height:1.45;min-height:160px;resize:vertical;white-space:pre;overflow:auto}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--amber)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
button,.btn{font:inherit;font-weight:600;font-size:16px;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button:disabled{opacity:.6;cursor:wait}
.primary{background:var(--amber);color:#2a1a00}
.secondary{background:var(--panel-2);color:var(--fg);border:1px solid var(--line)}
.ghost{background:transparent;color:var(--muted);padding:8px 10px;font-weight:500;font-size:14px}
.small{font-size:14px;padding:9px 14px}
button:focus-visible,.btn:focus-visible,label.btn:focus-within{outline:3px solid var(--pink);outline-offset:2px}
.full{width:100%}
.feedback{font-size:15px;min-height:1.5em}
.feedback.bad,.err{color:var(--bad)} .feedback.ok,.okc{color:var(--ok)}
.nav{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
@media (max-width:380px){.nav{grid-template-columns:1fr;justify-items:center;text-align:center}}
.dial{width:150px;height:150px;border-radius:50%;position:relative;
  background:radial-gradient(circle,var(--panel-2) 0 58%,var(--bg) 59% 100%);border:2px solid var(--line)}
.dial .n{position:absolute;top:6px;left:50%;transform:translateX(-50%);font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.needle{position:absolute;inset:0;transition:transform .4s ease}
.needle svg{width:100%;height:100%}
.dist{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.coords{font-family:var(--f-mono);font-size:13px;color:var(--muted);word-break:break-all}
.status{font-size:14px;color:var(--muted)}
.final-word{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.final-word .tile{width:42px;height:52px;font-size:28px}
.found{font-family:var(--f-display);font-size:28px;font-weight:700;color:var(--amber);line-height:1.1}
.drop{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;position:relative}
.drop.over{border-color:var(--amber);background:rgba(255,184,77,.06)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.list li:last-child{border-bottom:0}
.list .num{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.list .nm{min-width:0;overflow-wrap:anywhere}
.list .nm small{display:block;color:var(--muted);font-size:13px}
.list .lt{font-family:var(--f-display);font-weight:700;color:var(--amber);min-width:1ch;text-align:right}
.cols{overflow-x:auto}
.cols table{border-collapse:collapse;font-size:13px;min-width:520px}
.cols td,.cols th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.cols th{font-family:var(--f-mono);font-weight:500;color:var(--amber)}
.msgs{font-size:14px;display:flex;flex-direction:column;gap:4px}
.confirm{background:var(--panel-2);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
footer{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;align-items:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:900;
  background:var(--pink);color:#2a0016;border-radius:999px;padding:14px 20px;box-shadow:0 8px 24px rgba(0,0,0,.45);font-weight:700}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.mapov{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;flex-direction:column}
.mapbar{display:flex;align-items:center;gap:10px;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.mapbar .t{display:flex;flex-direction:column;min-width:0}
.mapbar .t b{font-family:var(--f-display);font-size:19px;line-height:1.1}
.mapbar .t small{color:var(--muted);font-size:13px}
#map{flex:1;min-height:0;background:#0e0c1c}
.mapfoot{padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.mapfoot .lg{display:inline-flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:2px solid #fff}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5);display:grid;place-items:center}
.pin span{transform:rotate(45deg);font:700 11px/1 var(--f-body);color:#1b1030}
.pin.club{background:var(--amber)} .pin.food{background:var(--ok)} .pin.cache{background:var(--pink)}
.me{width:16px;height:16px;border-radius:50%;background:#4da3ff;border:3px solid #fff;box-shadow:0 0 0 6px rgba(77,163,255,.25)}
.osm-dark{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9) saturate(.6)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
.leaflet-popup-content{margin:12px 14px;font:14px/1.45 var(--f-body)}
.leaflet-popup-content b{font-family:var(--f-display);font-size:17px}
.leaflet-popup-content a{color:var(--amber)}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.leaflet-control-attribution{background:rgba(23,20,43,.8)!important;color:var(--muted)!important}
.leaflet-control-attribution a{color:var(--muted)!important}
.leaflet-bar a{background:var(--panel)!important;color:var(--fg)!important;border-color:var(--line)!important}
.track span.skip{background:repeating-linear-gradient(90deg,var(--line) 0 4px,transparent 4px 7px)}
.skipbox{display:flex;flex-direction:column;gap:8px;align-items:stretch}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">Geburtstags-Schnitzeljagd</span>
    <h1 id="title">Schnitzeljagd durch den Kessel</h1>
    <div class="track" id="track" aria-label="Fortschritt"></div>
  </header>
  <section aria-label="Gesammelte Buchstaben"><div class="tray" id="tray"></div></section>
  <main id="screen"><div class="card"><p class="muted">Route wird geladen …</p></div></main>
  <footer>
    <button class="ghost" id="resetBtn" type="button">Spiel zurücksetzen</button>
    <span id="resetConfirm" hidden>
      <button class="secondary small" id="resetYes" type="button">Ja, von vorn</button>
      <button class="ghost" id="resetNo" type="button">Abbrechen</button>
    </span>
  </footer>
</div>
<button class="fab" id="mapBtn" type="button" aria-haspopup="dialog">Club-Karte</button>
<div class="mapov" id="mapOv" role="dialog" aria-modal="true" aria-label="Karte der Langen Nacht der Clubs" hidden>
  <div class="mapbar">
    <div class="t"><b>Lange Nacht der Clubs</b><small>Sa 14.11. · ein Bändchen für alle 16 Clubs · After-Hour ab 6 Uhr im Proton</small></div>
    <div class="row" style="flex-wrap:nowrap">
      <button class="secondary small" id="locBtn" type="button">Wo bin ich?</button>
      <button class="primary small" id="mapClose" type="button">Schließen</button>
    </div>
  </div>
  <div id="map"></div>
  <div class="mapfoot">
    <span class="lg"><span class="dot" style="background:var(--amber)"></span>Club</span>
    <span class="lg"><span class="dot" style="background:var(--ok)"></span>Snack</span>
    <span class="lg"><span class="dot" style="background:var(--pink)"></span>Euer nächster Cache</span>
    <span class="lg"><span class="dot" style="background:#4da3ff"></span>Ihr</span>
    <span id="locMsg"></span>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ---------- shared: answer normalisation + route crypto ---------- */
const ARTICLES=/^(der|die|das|den|dem|ein|eine|einen|einem|mein|meine|dein|deine|unser|unsere|the|a|an)\s+/i;
const normText=s=>String(s??"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ß/g,"ss").toLowerCase().replace(/[^a-z0-9]/g,"");
const normAnswer=s=>normText(String(s??"").trim().replace(ARTICLES,""));
const _enc=new TextEncoder(), _dec=new TextDecoder();
const b64=u8=>{let s="";for(let i=0;i<u8.length;i++)s+=String.fromCharCode(u8[i]);return btoa(s);};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function answerKey(answer,salt,idx,iter){
  const base=await crypto.subtle.importKey("raw",_enc.encode(normAnswer(answer)),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:_enc.encode(salt+":"+idx),iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function seal(key,bytes){const iv=crypto.getRandomValues(new Uint8Array(12));
  return {iv:b64(iv),ct:b64(new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,bytes)))};}
async function unseal(key,box){try{return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(box.iv)},key,unb64(box.ct)));}catch(e){return null;}}
const payloadOf=s=>({name:s.name,area:s.area,lat:s.lat,lng:s.lng,travel:s.travel,way:s.way,info:s.info,mission:s.mission,letter:s.letter});
async function encryptRoute(stops,title){
  const salt=b64(crypto.getRandomValues(new Uint8Array(16))), iter=150000;
  const out={v:1,title:title||"Schnitzeljagd",salt,iter,letters:stops.filter(s=>s.mission&&s.letter).length,stops:[]};
  for(let i=0;i<stops.length;i++){
    const s=stops[i];
    if(i===0){ out.stops.push({start:payloadOf(s)}); continue; }
    const raw=crypto.getRandomValues(new Uint8Array(32));
    const ck=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["encrypt"]);
    const payload=await seal(ck,_enc.encode(JSON.stringify(payloadOf(s))));
    const variants=[...new Set(s.answers.map(normAnswer).filter(Boolean))];
    const keys=[];
    for(const v of variants){ keys.push(await seal(await answerKey(v,salt,i,iter),raw)); }
    for(let j=keys.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[keys[j],keys[k]]=[keys[k],keys[j]];}
    out.stops.push({riddle:s.riddle,hints:s.hints,payload,keys});
  }
  return out;
}
async function tryUnlock(route,idx,answer){
  if(!normAnswer(answer)) return null;
  const e=route.stops[idx], k=await answerKey(answer,route.salt,idx,route.iter);
  for(const box of e.keys){
    const raw=await unseal(k,box);
    if(raw){ const ck=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
      const p=await unseal(ck,e.payload); if(p) return JSON.parse(_dec.decode(p)); }
  }
  return null;
}

/* ---------- shared: CSV ---------- */
function parseCSV(text){
  text=String(text).replace(/^﻿/,"");
  const first=text.split(/\r?\n/)[0]||"";
  const delim=(first.split(";").length>=first.split(",").length)?";":",";
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===delim){row.push(f);f="";}
    else if(c==="\n"||c==="\r"){ if(c==="\r"&&text[i+1]==="\n") i++; row.push(f);rows.push(row);row=[];f=""; }
    else f+=c;
  }
  if(f!==""||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(x=>x.trim()!==""));
}
const ALIASES={name:["name","location","bar"],area:["bereich","stadtteil","area"],lat:["breitengrad","lat","latitude","breite"],
  lng:["laengengrad","längengrad","lng","lon","longitude","laenge","länge"],travel:["anreise","travel"],way:["weg","wegbeschreibung","anfahrt"],
  info:["info","notiz","note"],mission:["mission","aufgabe"],letter:["buchstabe","letter"],riddle:["raetsel","rätsel","riddle"],
  hint1:["tipp1","tipp 1","hint1"],hint2:["tipp2","tipp 2","hint2"],answers:["antworten","antwort","answers","loesung","lösung"]};
function stopsFromCSV(text){
  const errors=[],warnings=[];
  const rows=parseCSV(text);
  if(rows.length<2) return {errors:["Die CSV braucht eine Kopfzeile und mindestens zwei Locations."],warnings,stops:[]};
  const head=rows[0].map(h=>h.trim().toLowerCase()), idx={};
  for(const k in ALIASES) idx[k]=head.findIndex(h=>ALIASES[k].includes(h));
  ["name","lat","lng"].forEach(k=>{if(idx[k]<0) errors.push(`Spalte „${ALIASES[k][0]}“ fehlt in der Kopfzeile.`);});
  if(errors.length) return {errors,warnings,stops:[]};
  const get=(r,k)=>idx[k]>=0?(r[idx[k]]||"").trim():"";
  const num=v=>parseFloat(v.replace(",","."));
  const stops=rows.slice(1).map((r,i)=>{
    const z=i+2, s={name:get(r,"name"),area:get(r,"area"),lat:num(get(r,"lat")),lng:num(get(r,"lng")),
      travel:/öff|oeff|bahn|bus|transit|tram/i.test(get(r,"travel"))?"transit":"walking",way:get(r,"way"),
      info:get(r,"info"),mission:get(r,"mission"),letter:get(r,"letter").slice(0,1).toUpperCase(),
      riddle:get(r,"riddle"),hints:[get(r,"hint1"),get(r,"hint2")].filter(Boolean),
      answers:get(r,"answers").split("|").map(a=>a.trim()).filter(Boolean)};
    if(!s.name) errors.push(`Zeile ${z}: Name fehlt.`);
    if(!(s.lat>=-90&&s.lat<=90)||!(s.lng>=-180&&s.lng<=180)) errors.push(`Zeile ${z} (${s.name||"?"}): Koordinaten fehlen oder sind ungültig.`);
    if(i>0&&!s.riddle) errors.push(`Zeile ${z} (${s.name}): Rätsel fehlt. Ohne Rätsel lässt sich der Cache nicht freischalten.`);
    if(i>0&&s.riddle&&!s.answers.length) errors.push(`Zeile ${z} (${s.name}): Antworten fehlen.`);
    
    if(i>0&&s.answers.some(a=>normText(a).length&&normText(s.name).includes(normAnswer(a))&&normAnswer(a).length>3))
      warnings.push(`Zeile ${z}: Eine Antwort steckt im Namen der Bar und könnte sie verraten.`);
    return s;
  });
  return {errors,warnings,stops};
}

const KEY="schnitzeljagd-spiel-v3";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let ROUTE=null, state=null;
const N=()=>ROUTE.stops.length;
const fresh=()=>({salt:ROUTE.salt,stage:0,phase:"intro",hints:0,unlocked:{},got:[],popped:-1,skipped:{}});
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function loadState(){let s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  state=(s&&s.salt===ROUTE.salt&&s.stage<N())?s:fresh();}
const stopAt=i=>i===0?ROUTE.stops[0].start:state.unlocked[i];

function renderChrome(){
  const t=$("#track"); t.innerHTML="";
  for(let i=0;i<N();i++){const sp=document.createElement("span");
    if(state.skipped&&state.skipped[i]) sp.className="skip"; else if(i<state.stage||state.phase==="final") sp.className="done"; else if(i===state.stage) sp.className="now"; t.appendChild(sp);}
  const tray=$("#tray"); tray.innerHTML="";
  for(let i=0;i<ROUTE.letters;i++){const d=document.createElement("div"),g=state.got[i];
    d.className="tile"+(g?" got":"")+(i===state.popped?" pop":""); d.textContent=g||"?"; d.setAttribute("aria-label",g||"noch offen"); tray.appendChild(d);}
  tray.parentElement.hidden=!ROUTE.letters; state.popped=-1;
}

function render(){
  stopGeo(); renderChrome();
  const i=state.stage, s=stopAt(i), last=i===N()-1, el=$("#screen");
  if(state.phase==="intro"){
    el.innerHTML=`<div class="card">
      <span class="tag amber">Briefing</span>
      <h2>Schnitzel, Bars, dann die Clubs.</h2>
      <p>An jeder Station schaltet ein Rätsel die Koordinaten der nächsten Station frei. Wohin es geht, erfahrt ihr erst, wenn ihr dort steht.</p>
      ${ROUTE.letters?`<p>Wer am Ende das ganze Lösungswort hat, nennt es am Ziel.</p>`:""}
      <p class="note">Treffpunkt: ${esc(s.name)}${s.area?", "+esc(s.area):""}. Ein Handy pro Team führt das Spiel, der Fortschritt bleibt auf diesem Gerät.</p>
      <button class="primary full" id="go" type="button">Zum Treffpunkt</button></div>`;
    $("#go").onclick=()=>{state.phase="nav";save();render();};
  }
  else if(state.phase==="nav") renderNav(i,s);
  else if(state.phase==="found"){
    el.innerHTML=`<div class="card">
      <span class="tag amber">Cache ${i+1} gefunden</span>
      <p class="found">${esc(s.name)}</p>
      ${s.area?`<p class="muted">${esc(s.area)}</p>`:""}
      ${s.mission?`<h2>Mission</h2><p class="riddle">${esc(s.mission)}</p>`:""}
      ${s.info?`<p class="note">${esc(s.info)}</p>`:""}
      <button class="primary full" id="done" type="button">${s.mission?(s.letter?"Mission erfüllt, Buchstabe her":"Mission erfüllt"):(last?"Zum Ziel":"Weiter zum Rätsel")}</button></div>`;
    $("#done").onclick=()=>{
      if(s.mission&&s.letter){state.popped=state.got.length;state.got.push(s.letter);}
      state.phase=last?"final":"riddle"; state.hints=0; save(); render(); };
  }
  else if(state.phase==="riddle") renderRiddle(i+1);
  else if(state.phase==="final"){
    el.innerHTML=`<div class="card" style="text-align:center;align-items:center">
      <span class="tag amber">Ziel erreicht</span>
      <h2>${state.got.length?"Das Lösungswort":"Geschafft!"}</h2>
      ${state.got.length?`<div class="final-word">${state.got.map(c=>`<div class="tile got">${esc(c)}</div>`).join("")}</div>`:""}
      <p>${state.got.length?"Nennt das Wort am Tisch. ":""}Alles Gute zum Geburtstag! Ab jetzt ist die Nacht frei, die Club-Karte unten rechts zeigt euch alle Clubs.</p>
      ${s&&s.info?`<p class="note">${esc(s.info)}</p>`:""}</div>`;
  }
}

function renderRiddle(n){
  const e=ROUTE.stops[n], el=$("#screen");
  const hintHtml=e.hints.slice(0,state.hints).map((h,k)=>`<div class="hint"><strong>Hinweis ${k+1}:</strong> ${esc(h)}</div>`).join("");
  el.innerHTML=`<div class="card">
    <span class="tag">Rätsel für Cache ${n+1}</span>
    <p class="riddle">${esc(e.riddle)}</p>
    ${hintHtml}
    <form id="f" class="row" autocomplete="off">
      <input type="text" id="ans" placeholder="Eure Antwort" aria-label="Antwort" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button class="primary" type="submit" id="chk">Prüfen</button>
    </form>
    <div class="feedback" id="fb" role="status"></div>
    ${state.hints<e.hints.length?`<div class="row"><button class="secondary" id="hintBtn" type="button">Hinweis nehmen</button></div>`:""}
    ${skipHtml(n)}
    <p class="note">Die richtige Antwort entschlüsselt die Koordinaten. Raten über die Lösung gibt es nicht, fragt notfalls die Spielleitung.</p></div>`;
  $("#f").onsubmit=async ev=>{ev.preventDefault();
    const v=$("#ans").value; if(!v.trim()) return;
    const b=$("#chk"); b.disabled=true; b.textContent="Prüfe …";
    let p=null; try{p=await tryUnlock(ROUTE,n,v);}catch(err){}
    b.disabled=false; b.textContent="Prüfen";
    if(p){ $("#fb").className="feedback ok"; $("#fb").textContent="Richtig! Die Koordinaten sind entschlüsselt.";
      state.unlocked[n]=p; setTimeout(()=>{state.stage=n;state.phase="nav";save();render();},900); }
    else{ $("#fb").className="feedback bad"; $("#fb").textContent="Das öffnet den Cache nicht. Versucht es nochmal.";
      const inp=$("#ans"); inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake"); }
  };
  const hb=$("#hintBtn"); if(hb) hb.onclick=()=>{state.hints++;save();renderRiddle(n);};
  wireSkip(()=>skipFrom(n));
}


/* ---------- Bar überspringen ---------- */
function prevUnlocked(i){ for(let k=i-1;k>=0;k--){ const s=stopAt(k); if(s) return s; } return null; }
function skipHtml(n){
  const last=n===N()-1;
  return `<div class="skipbox"><button class="ghost" id="skipBtn" type="button">${last?"Letzte Station überspringen":"Diese Bar überspringen"}</button>
    <div class="confirm" id="skipConfirm" hidden><p>${last?"Die letzte Station auslassen und das Spiel beenden?":"Diese Bar auslassen? Ihr bekommt direkt das Rätsel für die nächste Station."}</p>
    <div class="row"><button class="secondary small" id="skipYes" type="button">Ja, überspringen</button><button class="ghost" id="skipNo" type="button">Abbrechen</button></div></div></div>`;
}
function wireSkip(fn){ const b=$("#skipBtn"); if(!b) return;
  b.onclick=()=>{$("#skipConfirm").hidden=false;b.hidden=true;};
  $("#skipNo").onclick=()=>{$("#skipConfirm").hidden=true;b.hidden=false;};
  $("#skipYes").onclick=fn; }
function goRiddleOrEnd(n){ // n = skipped station
  state.skipped=state.skipped||{}; state.skipped[n]=true; state.hints=0;
  if(n>=N()-1){ state.stage=N()-1; state.phase="final"; }
  else { state.stage=n; state.phase="riddle"; }
  save(); render(); window.scrollTo({top:0,behavior:"smooth"});
}
function skipNav(i){ stopGeo(); goRiddleOrEnd(i); }      // heading to bar i, skip it
function skipFrom(n){ goRiddleOrEnd(n); }                // riddle would unlock bar n, skip it

/* ---------- Navigation ---------- */
let geoWatch=null, heading=null, orientOn=false;
function stopGeo(){ if(geoWatch!==null&&navigator.geolocation) navigator.geolocation.clearWatch(geoWatch); geoWatch=null; }
const toRad=d=>d*Math.PI/180, toDeg=r=>r*180/Math.PI;
function distance(a,b,c,d){const R=6371000,dLat=toRad(c-a),dLng=toRad(d-b);
  const x=Math.sin(dLat/2)**2+Math.cos(toRad(a))*Math.cos(toRad(c))*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(x));}
function bearing(a,b,c,d){const y=Math.sin(toRad(d-b))*Math.cos(toRad(c));
  const x=Math.cos(toRad(a))*Math.sin(toRad(c))-Math.sin(toRad(a))*Math.cos(toRad(c))*Math.cos(toRad(d-b));
  return (toDeg(Math.atan2(y,x))+360)%360;}
const DIRS=["Norden","Nordosten","Osten","Südosten","Süden","Südwesten","Westen","Nordwesten"];
const dirName=b=>DIRS[Math.round(b/45)%8];
const fmtDist=m=>m<1000?Math.round(m/10)*10+" m":(m/1000).toFixed(1).replace(".",",")+" km";

function renderNav(i,s){
  const prev=prevUnlocked(i);
  const maps=`https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}&travelmode=${s.travel}`;
  const fb=prev?bearing(prev.lat,prev.lng,s.lat,s.lng):null, fd=prev?distance(prev.lat,prev.lng,s.lat,s.lng):null;
  $("#screen").innerHTML=`<div class="card">
    <span class="tag amber">Peilung · Cache ${i+1} von ${N()}</span>
    <h2>${i===0?esc(s.name):(i===N()-1?"Das Ziel":"Cache "+(i+1))}</h2>
    ${i>0&&s.way?`<p>${esc(s.way)}</p>`:""}
    <div class="nav">
      <div class="dial" aria-hidden="true"><span class="n">N</span>
        <div class="needle" id="needle"><svg viewBox="0 0 100 100"><polygon points="50,14 61,54 50,47 39,54" fill="var(--pink)"/><polygon points="50,86 39,54 50,61 61,54" fill="var(--line)"/><circle cx="50" cy="54" r="4" fill="var(--fg)"/></svg></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;min-width:0">
        <div class="dist" id="dist">${fd!==null?fmtDist(fd):"–"}</div>
        <div class="status" id="geoStatus">${prev?`Luftlinie vom letzten Cache, Richtung ${dirName(fb)}.`:"Startet die GPS-Peilung."}</div>
        <div class="coords">${s.lat.toFixed(5)}, ${s.lng.toFixed(5)}</div>
      </div>
    </div>
    <div class="row">
      <button class="secondary" id="gpsBtn" type="button">GPS-Peilung starten</button>
      <a class="btn secondary" href="${maps}" target="_blank" rel="noopener">${s.travel==="transit"?"Öffi-Route":"Fußweg"} in Maps</a>
    </div>
    <button class="primary full" id="arrived" type="button">Wir sind da</button>
    ${i>0?skipHtml(i):""}</div>`;
  if(fb!==null) setNeedle(fb);
  $("#gpsBtn").onclick=()=>startGeo(s);
  $("#arrived").onclick=arrive;
  wireSkip(()=>skipNav(i));
}
function setNeedle(b){const n=$("#needle"); if(!n) return; n.dataset.b=b; n.style.transform=`rotate(${heading!==null?b-heading:b}deg)`;}
function arrive(){ stopGeo(); state.phase="found"; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); }
function startGeo(s){
  const st=$("#geoStatus"); enableCompass();
  if(!("geolocation" in navigator)){st.textContent="Kein GPS im Browser. Nutzt den Maps-Link.";return;}
  st.textContent="Suche Standort …"; stopGeo();
  geoWatch=navigator.geolocation.watchPosition(p=>{
    const c=p.coords, d=distance(c.latitude,c.longitude,s.lat,s.lng), b=bearing(c.latitude,c.longitude,s.lat,s.lng);
    $("#dist").textContent=fmtDist(d); setNeedle(b);
    st.textContent=d<60?"Ihr seid fast da! Schaut euch um.":`Richtung ${dirName(b)}${heading===null?" (Norden ist oben)":""}. Genauigkeit ±${Math.round(c.accuracy)} m.`;
    if(d<40){ st.textContent="Cache gefunden!"; stopGeo(); setTimeout(arrive,1200); }
  },err=>{ st.textContent=err.code===1?"Standort wurde nicht freigegeben. Nutzt den Maps-Link oder erlaubt den Standort in den Browser-Einstellungen.":"Kein GPS-Signal. Nutzt den Maps-Link."; },
  {enableHighAccuracy:true,maximumAge:5000,timeout:20000});
}
function onOrient(e){ let h=null;
  if(typeof e.webkitCompassHeading==="number") h=e.webkitCompassHeading; else if(e.absolute&&typeof e.alpha==="number") h=(360-e.alpha)%360;
  if(h===null) return; heading=h; const n=$("#needle"); if(n&&n.dataset.b) setNeedle(+n.dataset.b); }
function enableCompass(){ if(orientOn) return; orientOn=true;
  try{ if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function")
      DeviceOrientationEvent.requestPermission().then(r=>{if(r==="granted") addEventListener("deviceorientation",onOrient);}).catch(()=>{});
    else{ addEventListener("deviceorientationabsolute",onOrient); addEventListener("deviceorientation",onOrient); } }catch(e){} }


/* ---------- Club-Karte ---------- */
const CLUBS=[
 ["Proton","Königstraße 49",48.7736694,9.1751693,"club"],
 ["Nobby Bar","Königstraße 49",48.7737400,9.1753400,"club"],
 ["Anderthalb Bar","Königstraße 47",48.7739036,9.1749261,"club"],
 ["Club Schocken","Hirschstraße 36",48.7736597,9.1754309,"club"],
 ["Boa","Tübinger Straße 12–16",48.772644,9.174127,"club"],
 ["Hi Life","Rotebühlplatz 11",48.7741,9.17278,"club"],
 ["Havanna the Club","Marienstraße 3B",48.7730574,9.1731112,"club"],
 ["Havanna Bar","Paulinenstraße 49",48.7732293,9.1694899,"club"],
 ["Romy S.","Lange Straße 7",48.775534,9.174141,"club"],
 ["Climax Institutes","Calwer Straße 25",48.776084,9.1740091,"club"],
 ["Barbee Club","Theodor-Heuss-Straße 24",48.7763109,9.1724751,"club"],
 ["Comodo Studios","Eichstraße 6",48.7740279,9.1783521,"club"],
 ["Cavos","Lautenschlagerstraße 20",48.7817516,9.1781485,"club"],
 ["Wonders","Friedrichstraße 13",48.7822111,9.1776341,"club"],
 ["Kowalski","Kriegsbergstraße 28",48.7847701,9.1786482,"club"],
 ["The Park","Stresemannstraße 39",48.8051977,9.1744824,"club"],
 ["doen doen kebap","Josef-Hirn-Platz 8 · vegan, Fr/Sa bis 4 Uhr",48.7729042,9.177621,"food"]
];
let map=null, meMarker=null, cacheMarker=null, mapWatch=null;
const pinIcon=(cls,txt)=>L.divIcon({className:"",html:`<div class="pin ${cls}"><span>${txt}</span></div>`,iconSize:[26,26],iconAnchor:[3,26],popupAnchor:[10,-24]});
function initMap(){
  if(map||typeof L==="undefined") return !!map;
  map=L.map("map",{zoomControl:true,attributionControl:true}).setView([48.7765,9.1755],15);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,className:"osm-dark",
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
  CLUBS.forEach(([n,a,lat,lng,t],k)=>{
    const g=`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=walking`;
    L.marker([lat,lng],{icon:pinIcon(t,t==="food"?"🌯":k+1),title:n}).addTo(map)
      .bindPopup(`<b>${esc(n)}</b><br>${esc(a)}<br><a href="${g}" target="_blank" rel="noopener">Fußweg in Maps</a>`);
  });
  return true;
}
function updateCacheMarker(){
  if(!map) return;
  if(cacheMarker){map.removeLayer(cacheMarker);cacheMarker=null;}
  if(!ROUTE||!state||state.phase!=="nav") return;
  const s=stopAt(state.stage); if(!s) return;
  const label=state.stage===0?esc(s.name):"Cache "+(state.stage+1);
  cacheMarker=L.marker([s.lat,s.lng],{icon:pinIcon("cache","★"),zIndexOffset:1000}).addTo(map).bindPopup(`<b>${label}</b><br>Euer nächstes Ziel`);
}
function openMap(){
  const ov=$("#mapOv"); ov.hidden=false; document.body.style.overflow="hidden";
  if(!initMap()){ $("#map").innerHTML=`<div class="card" style="margin:16px"><p>Die Karte konnte nicht geladen werden. Prüft die Internetverbindung und öffnet sie nochmal.</p></div>`; return; }
  setTimeout(()=>map.invalidateSize(),50); updateCacheMarker(); $("#mapClose").focus();
}
function closeMap(){ $("#mapOv").hidden=true; document.body.style.overflow="";
  if(mapWatch!==null&&navigator.geolocation){navigator.geolocation.clearWatch(mapWatch);mapWatch=null;} $("#mapBtn").focus(); }
$("#mapBtn").onclick=openMap;
$("#mapClose").onclick=closeMap;
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!$("#mapOv").hidden) closeMap(); });
$("#locBtn").onclick=()=>{
  const msg=$("#locMsg");
  if(!map) return;
  if(!("geolocation" in navigator)){msg.textContent="Kein GPS im Browser.";return;}
  msg.textContent="Suche Standort …"; let first=true;
  if(mapWatch!==null) navigator.geolocation.clearWatch(mapWatch);
  mapWatch=navigator.geolocation.watchPosition(p=>{
    const ll=[p.coords.latitude,p.coords.longitude];
    if(!meMarker) meMarker=L.marker(ll,{icon:L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[16,16],iconAnchor:[8,8]}),zIndexOffset:2000}).addTo(map);
    else meMarker.setLatLng(ll);
    if(first){map.setView(ll,16);first=false;} msg.textContent="";
  },err=>{msg.textContent=err.code===1?"Standort nicht freigegeben.":"Kein GPS-Signal.";},{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
};

/* ---------- reset ---------- */
$("#resetBtn").onclick=()=>{$("#resetConfirm").hidden=false;$("#resetBtn").hidden=true;};
$("#resetNo").onclick=()=>{$("#resetConfirm").hidden=true;$("#resetBtn").hidden=false;};
$("#resetYes").onclick=()=>{ if(!ROUTE) return; state=fresh();save();$("#resetConfirm").hidden=true;$("#resetBtn").hidden=false;render();};

/* ---------- start ---------- */
(async()=>{
  try{ const r=await fetch("route.json",{cache:"no-store"}); if(!r.ok) throw 0; ROUTE=await r.json(); }
  catch(e){ $("#screen").innerHTML=`<div class="card"><h2>Route nicht gefunden</h2><p class="muted">Die Datei route.json fehlt neben dieser Seite. Bitte bei der Spielleitung melden.</p></div>`; return; }
  if(ROUTE.title){ $("#title").textContent=ROUTE.title; document.title=ROUTE.title; }
  loadState(); render();
})();
</script>
